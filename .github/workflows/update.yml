name: Mise à jour du calendrier

on:
  schedule:
    - cron: "17 3 * * 1" # chaque lundi à 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config.yaml
      - "prayer_calendar/**"

permissions:
  contents: write
  actions: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: pytest -q

      - name: Générer les calendriers
        run: python -m prayer_calendar.build

      - name: Publier s'il y a un changement
        run: |
          git add data docs
          if git diff --cached --quiet; then
            echo "Aucun changement, rien à publier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Mise à jour des horaires"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      # Dans un dépôt public, GitHub désactive les workflows planifiés après 60 jours sans activité.
      - name: Garder le workflow planifié actif
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"
